<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kundebuchungseite</title>
    <link rel="stylesheet" href="Kunde-Dashboard.css">
</head>
<body style="background-color: #f3f3f3">



<!-- Navbar -->
<nav class="navbar">
    <div class="navbar-logo">
        Fit & Aktiv
    </div>
    <p class="navbar-text">Kundebuchungseite (Kunde)</p>
    <!-- Right -->
    <div class="navbar-right">
        <img src="images/notification.png" class="navbar-icons">
        <img src="images/user.png" class="navbar-icons" id="profileBtn">

        <div id="profileBox" class="profile-box">
        <p id="profileName"></p>
        <p id="profileRole"></p>
        <button id="logoutBtn">Logout</button>
        </div>
    </div>
</nav>



<!-- Search Bar -->
<div class="search-container">
    <input type="text" placeholder="Kursname suchen..." class="search-input">

    <select class="filter-select">
        <option>Alle Studios</option>
    </select>

    <select class="filter-select">
        <option>Alle Tage</option>
    </select>

    <select class="filter-select">
        <option>Alle Zeiten</option>
    </select>

    <button class="filter-button">Filtern</button>
</div>


<!-- verfugbare kursen -->
<div class="content_container">

    <!-- left side -->
    <div class="verfugbar_container">
         <p class="verfugbar_title">Verfügbare Kurse</p>
         <div id="courses-list"></div>
    </div>

    <!-- Right side -->
    <div class="right_side">
        <div class="meine_buchungen">
             <p class="right_side_title">Meine Buchungen</p>
            <div id="bookings-list"></div>
        </div>

        <div class="benachrichtigungen">
             <p class="right_side_title">Benachrichtigungen</p>
             <div id="notifications-list"></div>
        </div>
    </div>
</div>




<!-- end -->
<div class="end">
    <p>Fit & Aktiv Scheduling System</p>
    <p>Version 1.0.0 | © 2026 Fit & Aktiv</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="Kunde-Dashboard.js"></script>

</body>
</html>
