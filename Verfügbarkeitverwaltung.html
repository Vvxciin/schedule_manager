<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verfügbarkeitverwaltung</title>
    <link rel="stylesheet" href="Verfügbarkeitverwaltung.css">
</head>
<body style="background-color: #f3f3f3">



<!-- Navbar -->
<nav class="navbar">
    <div class="navbar-logo">
        Fit & Aktiv
    </div>
    <div class="navbar-menu" id="navbarLinks">
        <a href="Trainer_Dashboard.html">Dashboard</a>
        <a href="Arbeitsstundenübersicht.html">Arbeitsstundenübersicht</a>
        <a href="Verfügbarkeitverwaltung.html">Verfügbarkeitverwaltung</a>
    </div>
    <!-- Right -->
    <div class="navbar-right">
        <img src="images/notification.png" class="navbar-icons">
        <img src="images/user.png" class="navbar-icons">
    </div>
</nav>


<!-- Meine Verfugbarkeit -->
<div class="meine_verfuegbarkeit_container">
    <div>
        <p class="titles" id="weekTitle" style="padding: 0px">
            Mein Wochenplan
        </p>
        <p class="gray_text" id="trainerInfoText">Trainer</p>
    </div>

    <p class="gray_text" style="margin-left: auto;">Woche auswählen:</p>

    <div class="week-buttons">
        <button class="vorherig-neachste-button" id="prevWeekBtn">← Vorherige Woche</button>
        <button class="vorherig-neachste-button" id="currentWeekBtn">Aktuelle Woche</button>
        <button class="vorherig-neachste-button" id="nextWeekBtn">Nächste Woche →</button>
    </div>
</div>


<div class="content_container">

    <!-- left side-wochenübersicht -->
    <div class="wochen_container">
        <p class="titles">Wochenübersicht</p>

        <div class="legend">
            <div><span class="box available"></span>Verfügbar</div>
            <div><span class="box unavailable"></span>Nicht verfügbar</div>
            <div><span class="box absent"></span>Abwesenheit</div>
        </div>

        <!-- Table -->
       <table class="week-table">
             <thead id="trainerScheduleHead"></thead>
             <tbody id="trainerScheduleBody"></tbody>
        </table>
    </div>

    <!-- Right side -->
    <div class="right_side">
        <div class="anwesenheit_melden">
            <p class="titles">Anwesenheit Melden</p>
            <hr>


<div id="availability-list"></div>

            <form class="absence-form">
                <label>Grund</label>
                <select>
                    <option>Krankmeldung</option>
                    <option>Urlaub</option>
                    <option>Sonstiges</option>
                </select>

                <div class="date-row">
                    <div>
                        <label>Von</label>
                        <input type="date" value="2026-05-29">
                    </div>

                    <div>
                        <label>Bis</label>
                        <input type="date" value="2026-05-29">
                    </div>
                </div>

                <label>Anmerkung (optional)</label>
                <textarea placeholder="Weitere Informationen..."></textarea>

                <button type="submit">Abwesenheit eintragen</button>
            </form>
        </div>

        <div class="gemeldete_anwesenheit">
    <p class="titles">Gemeldete Anwesenheit</p>

    <div id="absence-list"></div>
</div>
    </div>

</div>


<!-- end -->
<div class="end">
    <p>Fit & Aktiv Scheduling System</p>
    <p>Version 1.0.0 | © 2026 Fit & Aktiv</p>
</div>


<!-- Database -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="Verfügbarkeitverwaltung.js"></script>
</body>
</html>
