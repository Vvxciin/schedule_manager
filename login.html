<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <h2 class="Title-Text">Login</h2>

    <div class="login-row">
        <p class="Email-Pass-Text">Email:</p>
        <input class="placeholders" id="email" placeholder="Email">
    </div>

    <div class="login-row">
        <p class="Email-Pass-Text">Password:</p>
        <input class="placeholders" id="password" type="password" placeholder="Password">
    </div>

    <button class="login-button" onclick="login()">Login</button>


    <script src="login.js"></script>
</body>
</html>
