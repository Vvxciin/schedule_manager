<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <h2 class="Title-Text">Login</h2>

    <div class="login-row">
        <p class="Email-Pass-Text">Email:</p>
        <input class="placeholders" id="email" placeholder="Email">
    </div>

    <div class="login-row">
        <p class="Email-Pass-Text">Password:</p>
        <input class="placeholders" id="password" type="password" placeholder="Password">
    </div>

    <button class="login-button" onclick="login()">Login</button>


    <!-- end -->
    <div class="end">
        <p>Fit & Aktiv Scheduling System</p>
        <p>Version 1.0.0 | © 2026 Fit & Aktiv</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="Kunde-Dashboard.js"></script>


    <script src="login.js"></script>
</body>
</html>
