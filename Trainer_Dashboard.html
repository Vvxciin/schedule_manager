<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trainer Dashboard</title>
    <link rel="stylesheet" href="Trainer_Dashboard.css">
</head>
<body style="background-color: #f3f3f3">

<!-- Navbar -->
<nav class="navbar">
    <div class="navbar-logo">
        Fit & Aktive
    </div>
    <p class="navbar-text">Trainer Dashboard</p>
    <!-- Right -->
    <div class="navbar-right">
        <img src="images/notification.png" class="navbar-icons">
        <img src="images/user.png" class="navbar-icons">
    </div>
</nav>

<!-- info -->
<div class="info-container">
    <div class="info">
        <img src="images/clock.png" class="info-icons">
        <div class="info-content">
            <p class="info-text" style="color: gray">Wochenstunden</p>
            <p class="info-text" style="font-weight: bold;"> 18/20</p>
            <p class="info-text" style="color: gray">gearbeitet</p>
        </div>
    </div>
    <div class="info">
        <img src="images/location.png" class="info-icons">
        <div class="info-content">
            <p class="info-text" style="color: gray">Heutige Stansorte</p>
            <p class="info-text" style="font-weight: bold;"> 3</p>
            <p class="info-text" style="color: gray">Alle Aktiv</p>
        </div>
    </div>
    <div class="info">
        <img src="images/class.png" class="info-icons">
        <div class="info-content">
            <p class="info-text" style="color: gray">Heutige Kurse</p>
            <p class="info-text" style="font-weight: bold;"> 3</p>
            <p class="info-text" style="color: gray">Kurse</p>
        </div>
    </div>
    <div class="info">
        <img src="images/notification.png" class="info-icons">
        <div class="info-content">
            <p class="info-text" style="color: gray">Benachrichtungen</p>
            <p class="info-text" style="font-weight: bold;"> 3</p>
            <p class="info-text" style="color: gray">ungelesen</p>
        </div>
    </div>
</div>


<!-- table -->
<div class="table-contaners">
    <div class="table">
        <p class="table-text">Heutiger Zeitplan</p>
        <div class="inner-table">
            <table class="schedule-table">
                <thead>
                <tr>
                    <th>Zeit</th>
                    <th>Kurs</th>
                    <th>Studio</th>
                    <th>Raum</th>
                </tr>
                </thead>
                <tbody id="schedule-body"></tbody>
            </table>
        </div>
    </div>
    <div class="table">
        <p class="table-text">Benarichtungen</p>
        <div class="inner-table"></div>
        <button class="table-button">Alle anzeigen</button>
    </div>
</div>

<!-- end -->
<div class="end">
    <p>Fit & Aktiv Scheduling System</p>
    <p>Version 1.0.0 | © 2026 Fit & Aktiv</p>
</div>


<!-- Database -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="Trainer_Dashboard.js"></script>

</body>
</html>
